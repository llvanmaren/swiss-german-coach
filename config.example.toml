# Copy to config.toml (gitignored) and edit. Everything here is example data.

[learner]
name = "Alex"
goal = "Hold a relaxed, spontaneous 20-minute conversation in Zürich German on arrival"
deadline = 2027-06-01
deadline_label = "the move to Zürich"
timezone = "Europe/Zurich"          # used for "today", so evening sessions land on the right day
background = "Native English speaker with some school Standard German; keep sentences simple and raise complexity gradually."
# Optional longer mission/plan in Markdown, returned verbatim by start_session.
# Keep personal files outside the repo (data/ is gitignored).
# mission_file = "data/mission.md"

[dialect]
name = "Zürich German"
local_name = "Züritüütsch"
comprehension_later = "Bernese and Basel German for comprehension later"

[coach]
focus_size = 4             # focus words at a time
focus_max_sessions = 3     # sessions a word stays in focus before rotating back to spaced review
benchmark_weekday = 6      # 0 = Monday ... 6 = Sunday
finish_words = ["fertig", "tschüss"]

# Study phases: start_session reports the current one.
[[phases]]
start = 2026-11-01
end = 2026-11-30
daily_minutes = "10-15"
focus = "Baseline; speak rather than translate; everyday routines"

[[phases]]
start = 2026-12-01
end = 2027-02-28
daily_minutes = "20"
focus = "Unexpected questions, short stories, past and future"

[[phases]]
start = 2027-03-01
end = 2027-05-31
daily_minutes = "20-25"
focus = "Opinions, topic changes, real-life simulations, final assessment"

[[milestones]]
date = 2026-11-29
label = "4-week review"

[[milestones]]
date = 2027-02-28
label = "Interim benchmark: 10-minute unscripted conversation"

[[milestones]]
date = 2027-05-30
label = "Final assessment: 20-minute conversation"
